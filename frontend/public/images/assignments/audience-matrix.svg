  <!-- Bottom Strip -->
  <rect x="40" y="444" width="720" height="34" rx="6" fill="#FFFFFF" stroke="#DCDCDC" />
  <text x="56" y="465" class="sub" font-size="10">SUBMISSION: GOOGLE DOCS // EXCEL WORKBOOK // BCA VII SEMESTER, DSVV</text>
