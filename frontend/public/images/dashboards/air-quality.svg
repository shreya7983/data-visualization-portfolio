<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="airBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23272D" />
      <stop offset="100%" stop-color="#16181D" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#airBg)" />

  <rect x="30" y="24" width="1140" height="56" rx="4" fill="#2A3038" stroke="#B9AEC9" stroke-opacity="0.25" />
  <circle cx="56" cy="52" r="6" fill="#B9AEC9" />
  <circle cx="74" cy="52" r="6" fill="#A8B8A0" />
  <circle cx="92" cy="52" r="6" fill="#DDB7A3" />
  <text x="120" y="58" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#F7F4EE" letter-spacing="1">TABLEAU // METROPOLITAN AIR QUALITY INDEX &amp; PARTICULATE POLLUTANT DYNAMICS</text>
  <text x="1030" y="58" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B9AEC9">METEOROLOGY</text>

  <!-- Metric Strip -->
  <g transform="translate(30, 96)">
    <rect x="0" y="0" width="265" height="96" rx="4" fill="#252A30" stroke="#B9AEC9" stroke-opacity="0.25" />
    <text x="20" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B9AEC9" letter-spacing="1.5">ANNUAL MEAN PM2.5</text>
    <text x="20" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#F7F4EE">96.4 µg/m³</text>
    <text x="175" y="68" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#DDB7A3">HAZARDOUS</text>

    <rect x="290" y="0" width="265" height="96" rx="4" fill="#252A30" stroke="#B9AEC9" stroke-opacity="0.25" />
    <text x="310" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B9AEC9" letter-spacing="1.5">WINTER INVERSION MULTIPLIER</text>
    <text x="310" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#DDB7A3">3.4x</text>
    <text x="440" y="68" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#DDB7A3">SEASONAL</text>

    <rect x="580" y="0" width="265" height="96" rx="4" fill="#252A30" stroke="#B9AEC9" stroke-opacity="0.25" />
    <text x="600" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B9AEC9" letter-spacing="1.5">TRANSIT CORRIDOR NO2</text>
    <text x="600" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#A8B8A0">-14.0%</text>
    <text x="750" y="68" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A8B8A0">24-MO DROP</text>

    <rect x="870" y="0" width="270" height="96" rx="4" fill="#252A30" stroke="#B9AEC9" stroke-opacity="0.25" />
    <text x="890" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#B9AEC9" letter-spacing="1.5">CLEAN AIR DAYS</text>
    <text x="890" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#F7F4EE">48 / 365</text>
    <text x="1040" y="68" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#C9B27C">13.1%</text>
  </g>

  <!-- Left: Multi-Pollutant Trend -->
  <g transform="translate(30, 210)">
    <rect x="0" y="0" width="600" height="420" rx="4" fill="#252A30" stroke="#B9AEC9" stroke-opacity="0.2" />
    <text x="24" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#F7F4EE" letter-spacing="1">12-MONTH AQI &amp; PARTICULATE EXCEEDANCE</text>
    
    <g transform="translate(40, 60)">
      <line x1="0" y1="300" x2="520" y2="300" stroke="#B9AEC9" stroke-opacity="0.3" />
      
      <!-- PM2.5 Curve -->
      <path d="M 0 250 L 50 230 L 100 240 L 150 210 L 200 170 L 250 190 L 300 140 L 350 90 L 400 40 L 450 60 L 500 120" 
            fill="none" stroke="#DDB7A3" stroke-width="3" />
      
      <!-- PM10 Curve -->
      <path d="M 0 200 L 50 180 L 100 190 L 150 160 L 200 130 L 250 150 L 300 100 L 350 50 L 400 20 L 450 30 L 500 80" 
            fill="none" stroke="#B9AEC9" stroke-width="2" stroke-dasharray="4 4" />

      <!-- Safe WHO Threshold Line -->
      <line x1="0" y1="260" x2="520" y2="260" stroke="#A8B8A0" stroke-width="1.5" stroke-dasharray="2 2" />
      <text x="400" y="252" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#A8B8A0">WHO SAFETY THRESHOLD</text>
    </g>
  </g>

  <!-- Right: Atmospheric Spatial Inversion Map -->
  <g transform="translate(650, 210)">
    <rect x="0" y="0" width="520" height="420" rx="4" fill="#252A30" stroke="#B9AEC9" stroke-opacity="0.2" />
    <text x="24" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#F7F4EE" letter-spacing="1">METEOROLOGICAL INVERSION &amp; DISPERSION</text>

    <g transform="translate(40, 80)">
      <circle cx="220" cy="150" r="120" fill="#2B323B" stroke="#B9AEC9" stroke-opacity="0.2" />
      <circle cx="220" cy="150" r="80" fill="#B9AEC9" fill-opacity="0.2" stroke="#B9AEC9" stroke-opacity="0.4" />
      <circle cx="220" cy="150" r="45" fill="#DDB7A3" fill-opacity="0.5" stroke="#DDB7A3" />

      <text x="220" y="145" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#F7F4EE" text-anchor="middle">URBAN CORE</text>
      <text x="220" y="162" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#DDB7A3" text-anchor="middle">AQI 380+</text>

      <!-- Wind vectors -->
      <path d="M 80 40 L 160 90" stroke="#A8B8A0" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M 320 220 L 380 260" stroke="#A8B8A0" stroke-width="2" marker-end="url(#arrow)" />
      <text x="100" y="30" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#A8B8A0">NW Prevailing Wind</text>
    </g>
  </g>

  <!-- Clear Placeholder Notice Strip -->
  <rect x="30" y="654" width="1140" height="72" rx="4" fill="#16181D" stroke="#B9AEC9" stroke-width="1" stroke-dasharray="6 4" />
  <text x="600" y="688" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#B9AEC9" letter-spacing="1.5" text-anchor="middle">
    [ DASHBOARD SCREENSHOT PLACEHOLDER — REPLACE WITH YOUR TABLEAU EXPORT ]
  </text>
  <text x="600" y="708" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#F7F4EE" text-anchor="middle">
    Drop actual dashboard screenshot into frontend/public/images/dashboards/air-quality.png to replace
  </text>
</svg>
