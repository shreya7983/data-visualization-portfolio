<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="studyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262529" />
      <stop offset="100%" stop-color="#19191C" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#studyBg)" />

  <!-- Top Title Bar -->
  <rect x="30" y="24" width="1140" height="56" rx="4" fill="#302E35" stroke="#DDB7A3" stroke-opacity="0.25" />
  <circle cx="56" cy="52" r="6" fill="#DDB7A3" />
  <circle cx="74" cy="52" r="6" fill="#C9B27C" />
  <circle cx="92" cy="52" r="6" fill="#A8B8A0" />
  <text x="120" y="58" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#F7F4EE" letter-spacing="1">POWER BI // BEHAVIORAL CORRELATION: STUDY HABITS &amp; ACADEMIC RIGOR</text>
  <text x="1030" y="58" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#DDB7A3">N = 2,450 STUDENTS</text>

  <!-- Metric Strip -->
  <g transform="translate(30, 96)">
    <rect x="0" y="0" width="265" height="96" rx="4" fill="#2A282E" stroke="#DDB7A3" stroke-opacity="0.25" />
    <text x="20" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#DDB7A3" letter-spacing="1.5">OPTIMAL DAILY HOURS</text>
    <text x="20" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#F7F4EE">2.8 hrs</text>
    <text x="155" y="68" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A8B8A0">SWEET SPOT</text>

    <rect x="290" y="0" width="265" height="96" rx="4" fill="#2A282E" stroke="#DDB7A3" stroke-opacity="0.25" />
    <text x="310" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#DDB7A3" letter-spacing="1.5">SCREEN TIME CORRELATION</text>
    <text x="310" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#DDB7A3">-0.48</text>
    <text x="445" y="68" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#DDB7A3">INVERSE</text>

    <rect x="580" y="0" width="265" height="96" rx="4" fill="#2A282E" stroke="#DDB7A3" stroke-opacity="0.25" />
    <text x="600" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#DDB7A3" letter-spacing="1.5">PEER STUDY LIFT</text>
    <text x="600" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#F7F4EE">+19.2%</text>
    <text x="745" y="68" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#C9B27C">SCORE GAIN</text>

    <rect x="870" y="0" width="270" height="96" rx="4" fill="#2A282E" stroke="#DDB7A3" stroke-opacity="0.25" />
    <text x="890" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#DDB7A3" letter-spacing="1.5">SLEEP CONTINUITY</text>
    <text x="890" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" fill="#F7F4EE">7.2 hrs</text>
    <text x="1030" y="68" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A8B8A0">RECOMMENDED</text>
  </g>

  <!-- Left: Scatter Plot Matrix -->
  <g transform="translate(30, 210)">
    <rect x="0" y="0" width="600" height="420" rx="4" fill="#2A282E" stroke="#DDB7A3" stroke-opacity="0.2" />
    <text x="24" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#F7F4EE" letter-spacing="1">STUDY TIME VS. EXAM SCORE SCATTER PLOT</text>
    
    <g transform="translate(40, 60)">
      <line x1="0" y1="300" x2="520" y2="300" stroke="#DDB7A3" stroke-opacity="0.25" />
      <line x1="0" y1="0" x2="0" y2="300" stroke="#DDB7A3" stroke-opacity="0.25" />

      <!-- Scatter dots -->
      <circle cx="50" cy="270" r="4" fill="#A8B8A0" opacity="0.7"/>
      <circle cx="80" cy="250" r="4" fill="#A8B8A0" opacity="0.7"/>
      <circle cx="120" cy="230" r="4" fill="#C9B27C" opacity="0.7"/>
      <circle cx="150" cy="210" r="4" fill="#C9B27C" opacity="0.7"/>
      <circle cx="200" cy="180" r="4" fill="#C9B27C" opacity="0.7"/>
      <circle cx="240" cy="150" r="4" fill="#DDB7A3" opacity="0.8"/>
      <circle cx="270" cy="130" r="5" fill="#DDB7A3" opacity="0.9"/>
      <circle cx="310" cy="100" r="5" fill="#DDB7A3" opacity="0.9"/>
      <circle cx="350" cy="85" r="5" fill="#F7F4EE" />
      <circle cx="400" cy="80" r="5" fill="#F7F4EE" />
      <circle cx="450" cy="85" r="4" fill="#DDB7A3" opacity="0.8"/>
      <circle cx="490" cy="95" r="4" fill="#DDB7A3" opacity="0.6"/>

      <!-- Diminishing returns curve -->
      <path d="M 30 280 Q 250 140, 360 80 T 510 100" fill="none" stroke="#DDB7A3" stroke-width="2.5" />
    </g>
  </g>

  <!-- Right: Radar/Habit Profile -->
  <g transform="translate(650, 210)">
    <rect x="0" y="0" width="520" height="420" rx="4" fill="#2A282E" stroke="#DDB7A3" stroke-opacity="0.2" />
    <text x="24" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#F7F4EE" letter-spacing="1">STUDENT PROFILE HABIT RADAR</text>

    <!-- Radar polygons -->
    <g transform="translate(260, 230)">
      <polygon points="0,-120 114,-37 70,97 -70,97 -114,-37" fill="none" stroke="#DDB7A3" stroke-opacity="0.2" />
      <polygon points="0,-80 76,-25 47,65 -47,65 -76,-25" fill="none" stroke="#DDB7A3" stroke-opacity="0.2" />
      <polygon points="0,-100 95,-30 40,80 -55,75 -90,-20" fill="#DDB7A3" fill-opacity="0.3" stroke="#DDB7A3" stroke-width="2" />
      <text x="0" y="-130" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#F7F4EE" text-anchor="middle">Focus</text>
      <text x="130" y="-30" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#F7F4EE" text-anchor="middle">Retention</text>
      <text x="80" y="115" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#F7F4EE" text-anchor="middle">Consistency</text>
      <text x="-80" y="115" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#F7F4EE" text-anchor="middle">Sleep</text>
      <text x="-130" y="-30" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#F7F4EE" text-anchor="middle">Wellbeing</text>
    </g>
  </g>

  <!-- Clear Placeholder Notice Strip -->
  <rect x="30" y="654" width="1140" height="72" rx="4" fill="#19191C" stroke="#DDB7A3" stroke-width="1" stroke-dasharray="6 4" />
  <text x="600" y="688" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#DDB7A3" letter-spacing="1.5" text-anchor="middle">
    [ DASHBOARD SCREENSHOT PLACEHOLDER — REPLACE WITH YOUR POWER BI EXPORT ]
  </text>
  <text x="600" y="708" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#A8B8A0" text-anchor="middle">
    Drop actual dashboard screenshot into frontend/public/images/dashboards/study-habits.png to replace
  </text>
</svg>
